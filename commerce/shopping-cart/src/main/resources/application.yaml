server:
  port: 0

spring:
  application.name: shopping-cart
  config.import: "configserver:"
  cloud.config:
      discovery:
        enabled: true
        serviceId: config-server
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000

eureka.client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl.defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/

logging.level.org.springframework.web: DEBUG
logging.level.org.hibernate: DEBUG
logging.level.ru.yandex.practicum: DEBUG
logging.level.ru.yandex.practicum.interaction.warehouse.WarehouseClient: DEBUG
logging.level.feign: DEBUG
logging.level.org.springframework.web.client.RestTemplate: DEBUG
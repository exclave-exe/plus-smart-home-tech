aggregator:
  kafka:
    consumer:
      shapshot:
        bootstrap-servers: localhost:9092
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: ru.yandex.practicum.kafka.deserializer.SnapshotDeserializer
        group-id: telemetry.analyzer.snapshot
        enable-auto-commit: false
        snapshot-topic: telemetry.snapshots.v1
        timeout: 5000

      hub:
        bootstrap-servers: localhost:9092
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: ru.yandex.practicum.kafka.deserializer.HubDeserializer
        group-id: telemetry.analyzer.hub
        enable-auto-commit: false
        hub-topic: telemetry.hubs.v1
        timeout: 5000

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/test
    username: user
    password: 123

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        temp:
          use_jdbc_metadata_defaults: false
        default_schema: analyzer

  sql:
    init:
      mode: always

grpc:
  client:
    hub-router:
      address: static://localhost:59090
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext